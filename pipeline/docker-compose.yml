# Коллектор статистики. Ставится рядом с ботом: они делят том ./control —
# бот кладёт туда ключ командой /collect, коллектор его подхватывает.
#
# Разворачивать вместе с ботом (см. pipeline/README.md).
services:
  collector:
    build: .
    container_name: counterplay-collector
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data        # data.db переживает пересборку образа
      - ./control:/control      # обмен с ботом: key + status
    environment:
      CONTROL_DIR: /control
      DB_PATH: /app/data/data.db
    # Логи контейнера пишутся в json-файл без предела: коллектор печатает строку
    # на игрока, и за месяц это гигабайты на диске сервера, которые никто не
    # читает. Держим последние 30 МБ — на разбор случившегося хватает с лихвой.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Сам процесс занимает ~80-120 МБ, но в лимит входит и кэш файлов. При 256 МБ
    # кэш выдавливал процесс в своп (9 МБ в памяти, 203 в свопе), а база 3,7 ГБ
    # читалась с диска снова и снова — машина жила на потолке t3.micro в 500
    # операций/с, и публикация шла то 6 минут, то полтора часа. 450 МБ вмещают
    # тонкую базу (~320 МБ), из которой собираются побакетные. Соседи не страдают:
    # кэш ядро отбирает при нехватке, бот на пике брал 323 МБ из 911.
    mem_limit: 450m
